name: connectant-ribera-proves

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - postgres_dades:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
    ports:
      - "127.0.0.1:${API_PORT}:8080"
    environment:
      API_PORT: "8080"
      AD_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}?currentSchema=ribera,public
      AD_DB_USER: ${POSTGRES_USER}
      AD_DB_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "java",
          "-cp",
          "/app/lib/*",
          "org.connectantribera.infra.ComprovaSalut",
        ]
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 30s

volumes:
  postgres_dades: